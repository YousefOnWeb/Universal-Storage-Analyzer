name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # NOTE: per AGENTS.md pin actions to full commit SHAs before production.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-tools-dev cmake ninja-build g++
      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        run: brew install qt@6 cmake ninja
      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        run: |
          C:\tools\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-ucrt-x86_64-qt6-base mingw-w64-ucrt-x86_64-qt6-tools mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-gcc
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Unit tests
        run: ctest --test-dir build -L unit --output-on-failure
      - name: Integration tests
        run: ctest --test-dir build -L integration --output-on-failure
      - name: Smoke test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./build/src/UniversalStorageAnalyzer.exe --smoke-test
          else
            ./build/src/UniversalStorageAnalyzer --smoke-test
          fi
